name: 196 RP CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python quraşdır
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Node quraşdır
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Asılılıqlar
        run: |
          python -m pip install --upgrade pip
          pip install luaparser lupa sqlglot

      - name: Tam yoxlama
        run: bash tools/ci/run_ci.sh

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
#                                                                         #
#   196 RP | Rol-Pley Serveri                                  #
#                                                                         #
#   Bu server.cfg sizin FXServer-in əsas konfiqurasiya faylıdır.          #
#   Dəyişiklik etməzdən əvvəl şərhləri oxuyun.                            #
#                                                                         #
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

# ---- ŞƏBƏKƏ ----
# Portu dəyişmək istəmirsinizsə, toxunmayın. 30120 FiveM-in standart portudur.
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

# Serverin yalnız təsdiqlənmiş portlar vasitəsilə görünməsi
sv_endpointPrivacy true

# ---- SERVER ADI ----
sv_hostname "196 RP | Rol-Pley Serveri"

sets sv_projectName "196 RP"
sets sv_projectDesc "196 RP - Ən yaxşı rol-pley serveri. 70+ iş, real həyat mekanları, bələdiyyə, mexanik, balıqçılıq və daha çoxu!"
sets tags "196, rp, roleplay, esx, hayat, real"

# ---- LİSENSİYA AÇARI (MÜTLEQ) ----
# FiveM server açarını buraya yazın: https://keymaster.fivem.net/ saytından
# pulsuz əldə edə bilərsiniz. Açar olmadan server işləməz!
set sv_licenseKey "BURAYA_LISENS_ACHARINIZI_YAZIN"

# ---- STEAM WEB API (opsional) ----
# Steam avatarları üçün: https://steamcommunity.com/dev/apikey
set steam_webApiKey ""

# ---- OYUNÇULAR ----
sv_maxclients 48

# ---- OYUN VERSİYASI ----
# GTA V build versiyası. 3258 = ən son (mp2024_02).
sv_enforceGameBuild 3258

# ---- ONESYNC ----
# ESX 1.14 üçün mütləq aktiv olmalıdır.
set onesync on

# ---- MYSQL BAĞLANTISI (MÜTLEQ) ----
# MySQL məlumatlarınızı buraya yazın. Əvvəlcə 196rp.sql faylını
# MySQL-ə idxal etməyi unutmayın! (README-ə baxın)
set mysql_connection_string "mysql://root:PAROLUNUZU_YAZIN@localhost/196rp?waitForConnections=true&charset=utf8mb4"
set mysql_ui true

# ---- DİL ----
# Hər şey Azərbaycan dilində olacaq
setr esx:locale "az"
setr esx:localeFallback "true"

# ---- SİSTEM ----
set resources_useSystemChat true

# ---- SERVER İKONU ----
load_server_icon icon.png

# # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # # #

# ════════════════════════════════════════════════════════════════
#  Azerbaijan Role Play — FiveM QBCore Server
#  Framework: QBCore | Dillər: az | Whitelist: 196rp_whitelist
# ════════════════════════════════════════════════════════════════

sv_maxclients 64
set steam_webApiKey "none"
sets tags "196rp, azerbaijan, roleplay, qbcore, az"
sv_licenseKey "CHANGE_ME_FXLICENSE"
sv_hostname "Azerbaijan Role Play | 196 RP"
sets sv_projectName "Azerbaijan Role Play"
sets sv_projectDesc "Azerbaijan Role Play — ən yaxşı Azərbaycan RP serveri (QBCore)"
sets locale "az-AZ"
load_server_icon icon.png
sv_enforceGameBuild 3095
set resources_useSystemChat true

# MySQL (oxmysql) — bu dəyəri öz verilənlər bazanızla dəyişin
set mysql_connection_string "mysql://root:CHANGE_ME@127.0.0.1/azrp?charset=utf8mb4"

# Pma-Voice
setr voice_useNativeAudio true
setr voice_defaultCycle "GRAVE"
setr voice_defaultVolume 0.3
setr voice_enableRadioAnim 1
setr voice_syncData 1
setr voice_useSendingRangeOnly false

# QBCore
setr qb_locale "az"
setr UseTarget "true"

# ══════════ Əsas resurslar ══════════
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents

# QBCore
ensure qb-core
ensure [qb]
ensure [standalone]
ensure [voice]
ensure [defaultmaps]

# 196 RP xüsusi resursları (whitelist, iş mərkəzi, anim, tuninq, RP əmrləri)
ensure [196rp]

# ══════════ İcazələr (ACL) ══════════
add_ace group.admin command allow
add_ace resource.qb-core command allow

# İdarəetmə qrupları
add_ace qbcore.god command allow
add_ace qbcore.admin command allow
add_ace qbcore.mod command allow

add_principal qbcore.god group.admin
add_principal qbcore.god qbcore.admin
add_principal qbcore.admin qbcore.mod

# İlk admininiz — license / steam identifikatorunuzu bura yazın
# add_principal license:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA group.admin

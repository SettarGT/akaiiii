<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>196 RP | Media</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="tv" class="tv hidden">
        <div class="tv-top">
            <div class="tv-title">📺 196 Media</div>
            <button id="tv-close">✕</button>
        </div>
        <input id="tv-url" placeholder="YouTube / Twitch linki daxil et (https://...)" />
        <div class="tv-frame"><iframe id="tv-frame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
        <div class="tv-hint">Link yapışdır və Enter bas · Bağlamaq: ESC</div>
    </div>
    <script src="app.js"></script>
</body>
</html>

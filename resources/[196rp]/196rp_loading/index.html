<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>196 RP | Yüklənir...</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="bg-pattern"></div>

    <div class="container">
        <div class="logo">
            <div class="logo-badge">
                <span class="logo-number">196</span>
            </div>
            <div class="logo-text">
                <h1 class="logo-title">196 RP</h1>
                <p class="logo-subtitle">ROL-PLEY ŞƏHƏRİ</p>
            </div>
        </div>

        <div class="loading-area">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-info">
                <span class="progress-percent" id="progressPercent">0%</span>
                <span class="progress-status" id="progressStatus">Serverə qoşulur...</span>
            </div>
        </div>

        <div class="tips">
            <p class="tip-text" id="tipText">İpucu: İş axtarırsınızsa, Bələdiyyə binasına yaxınlaşın!</p>
        </div>

        <div class="footer">
            <p>© 196 RP — Ən yaxşı rol-pley təcrübəsi</p>
            <p class="footer-sub">Şəhər, iş, ailə, həyat. Hamısı bir yerdə.</p>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <title>196 RP | Vehicle UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="radial" class="hidden">
    <div class="veh-info">
      <div id="plate">AAA-000</div>
      <div class="veh-states">
        <span id="engine-state">Mühərrik: OFF</span>
        <span id="lock-state">Kilid: Açıq</span>
      </div>
    </div>

    <div class="ring">
      <button class="item it-0" data-action="engine"><span>🔑</span><b>Mühərrik</b></button>
      <button class="item it-1" data-action="lock"><span>🔒</span><b>Kilid</b></button>
      <button class="item it-2" data-action="doors"><span>🚪</span><b>Qapılar</b></button>
      <button class="item it-3" data-action="passenger"><span>🚖</span><b>Sərnişin</b></button>
      <button class="item it-4" data-action="trunk"><span>🧳</span><b>Baqaj</b></button>
      <button class="item it-5" data-action="hood"><span>🔧</span><b>Kapot</b></button>
      <button class="item it-6" data-action="windows"><span>🪟</span><b>Pəncərə</b></button>
      <button class="item it-7" data-action="lights"><span>💡</span><b>Farlar</b></button>
      <button class="item it-8" data-action="extra"><span>🚨</span><b>Əlavə</b></button>
      <button class="item it-9" data-action="close"><span>✖</span><b>Bağla</b></button>
      <div class="center">F5</div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>

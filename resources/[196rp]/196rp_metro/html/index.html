<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <title>196 RP | Metro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="metro" class="hidden">
    <div class="mt-shell">
      <div class="mt-head">
        <div class="mt-logo"><span>196</span> METRO</div>
        <div class="mt-route" id="route">LEGION → <b>...</b></div>
      </div>
      <div class="mt-track">
        <div class="mt-train" id="train">🚇</div>
        <div class="mt-line"></div>
        <div class="mt-dots" id="dots"></div>
      </div>
      <div class="mt-progress">
        <div class="mt-bar" id="bar"></div>
      </div>
      <div class="mt-tip">Sıxılın — növbəti stansiya gəlir... 🚇</div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>

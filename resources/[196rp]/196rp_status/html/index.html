<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>196 RP | HUD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ══════════ SOL: CAN / ZİREH ══════════ -->
    <div class="hud-left">
        <div class="vital vital-health" id="healthBlock">
            <div class="vital-icon">♥</div>
            <div class="vital-body">
                <div class="vital-top">
                    <span class="vital-name">CAN</span>
                    <span class="vital-value" id="healthValue">100</span>
                </div>
                <div class="vital-track">
                    <div class="vital-fill" id="healthFill"></div>
                </div>
            </div>
        </div>

        <div class="vital vital-armor" id="armorBlock">
            <div class="vital-icon">🛡</div>
            <div class="vital-body">
                <div class="vital-top">
                    <span class="vital-name">ZİREH</span>
                    <span class="vital-value" id="armorValue">0</span>
                </div>
                <div class="vital-track">
                    <div class="vital-fill" id="armorFill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ══════════ SAĞ: STATUSLAR ══════════ -->
    <div class="hud-right">
        <div class="status-pill" id="foodPill">
            <span class="status-icon">🍞</span>
            <div class="status-track"><div class="status-fill food" id="foodFill"></div></div>
            <span class="status-pct" id="foodPct">100</span>
        </div>
        <div class="status-pill" id="waterPill">
            <span class="status-icon">💧</span>
            <div class="status-track"><div class="status-fill water" id="waterFill"></div></div>
            <span class="status-pct" id="waterPct">100</span>
        </div>
        <div class="status-pill" id="energyPill">
            <span class="status-icon">⚡</span>
            <div class="status-track"><div class="status-fill energy" id="energyFill"></div></div>
            <span class="status-pct" id="energyPct">100</span>
        </div>
    </div>

    <!-- ══════════ ALT MƏRKƏZ: VAXT / PUL ══════════ -->
    <div class="hud-bottom">
        <div class="glass-item time-item">
            <span class="gi-icon">🕐</span>
            <span id="timeDisplay">00:00</span>
        </div>
        <div class="glass-divider"></div>
        <div class="glass-item money-item">
            <span class="gi-icon">💵</span>
            <span id="cashDisplay">$0</span>
        </div>
        <div class="glass-divider"></div>
        <div class="glass-item bank-item">
            <span class="gi-icon">🏦</span>
            <span id="bankDisplay">$0</span>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
